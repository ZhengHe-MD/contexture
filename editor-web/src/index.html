<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="root">
      <div id="editor"></div>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <!--
        Preview isolation (see docs/adr/0002-codemirror-in-a-web-view.md and
        Sources/ContextureApp/PreviewDocumentBuilder.swift):
          - sandbox="allow-same-origin" grants no scripting permission
            (allow-scripts is deliberately absent, so nothing rendered here
            can execute, however it got in), and the only reason for
            allow-same-origin at all is so this trusted outer page can read,
            restore, and synchronize the frame's scroll position — it does
            not by itself permit script execution.
          - Its document is always set via `.srcdoc` from native Swift
            (window.__contexture_setPreviewHTML below), never navigated to a
            URL, and that document embeds its own strict CSP meta tag that
            blocks every non-local resource load independent of scripting.
      -->
      <iframe
        id="preview"
        title="Preview"
        sandbox="allow-same-origin"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
    <dialog id="diagram-viewer" aria-labelledby="diagram-viewer-title">
      <header class="diagram-viewer__toolbar">
        <strong id="diagram-viewer-title">Diagram</strong>
        <div class="diagram-viewer__controls" aria-label="Diagram zoom controls">
          <button id="diagram-viewer-zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="diagram-viewer-fit" type="button">Fit</button>
          <output id="diagram-viewer-zoom" aria-live="polite">100%</output>
          <button id="diagram-viewer-zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="diagram-viewer-close" type="button" autofocus>Close</button>
        </div>
      </header>
      <div id="diagram-viewer-viewport" class="diagram-viewer__viewport">
        <div class="diagram-viewer__stage">
          <img id="diagram-viewer-image" alt="" draggable="false">
        </div>
      </div>
    </dialog>
    <script src="bundle.js"></script>
  </body>
</html>
